name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy (auto, patch, minor, major)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Dry-run simulation (no tags pushed or releases created)
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Automated Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Lint Workflows (actionlint)
        uses: raven-actions/actionlint@v2.2.0

      - name: Gatekeeper Validation (Action Metadata)
        run: |
          vp lint
          vpr typecheck
          vpr agent:test:unit

      - name: Execute Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUMP_ARG="${{ github.event.inputs.bump || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          vpx ./scripts/release.ts --bump="$BUMP_ARG" --push --github-release $DRY_RUN
