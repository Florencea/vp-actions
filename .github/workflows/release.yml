name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy (auto, patch, minor, major)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Dry-run simulation (no tags pushed or releases created)
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Automated Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Gatekeeper Validation
        run: |
          actionlint
          vpx ./scripts/test-metadata.ts

      - name: Execute Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BUMP_ARG="${{ github.event.inputs.bump || 'auto' }}"
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          vpx ./scripts/release.ts --bump="$BUMP_ARG" --push --github-release $DRY_RUN
