name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Actions Metadata & Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1

      - name: Lint Workflows and Actions (actionlint)
        uses: raven-actions/actionlint@v2

      - name: Validate Action Metadata & Configuration
        run: vpx ./scripts/test-metadata.ts

      - name: Check Code and Docs Formatting
        run: vpx oxfmt --check README.md actions/**/*.yml .github/**/*.yml scripts/*.ts package.json AGENTS.md

      - name: Test Release Automation (Dry Run)
        run: vpx ./scripts/release.ts --dry-run --bump=patch
