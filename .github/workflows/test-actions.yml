name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Actions Metadata & Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: package.json
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Lint Workflows and Actions (actionlint)
        uses: raven-actions/actionlint@v2.2.0

      - name: Validate TypeScript and Lint
        run: |
          vp lint
          vpr typecheck

      - name: Validate Action Metadata & Configuration
        run: vpx ./scripts/test-metadata.ts

      - name: Check Code and Docs Formatting
        run: vpr format:check

      - name: Test Release Automation (Dry Run)
        run: vpx ./scripts/release.ts --dry-run --bump=patch
