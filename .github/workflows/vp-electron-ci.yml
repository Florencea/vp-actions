name: Vite+ Standard Electron CI

on:
  workflow_call:
    inputs:
      pre-test-command:
        description: Command to execute before tests (e.g. vp run db:seed)
        type: string
        required: false
        default: ""
      build-command:
        description: Production build command for Electron targets
        type: string
        required: false
        default: vp run build:all
      enable-playwright:
        description: Whether to install Playwright Chromium browsers
        type: boolean
        required: false
        default: true
      enable-e2e:
        description: Whether to execute Electron pack and E2E smoke test
        type: boolean
        required: false
        default: true
      enable-package:
        description: Whether to test OS-specific packaging across Linux, macOS, and Windows
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+ Environment
        uses: Florencea/vp-actions/actions/setup-vp-env@v3.0.0
        with:
          checkout: "false"

      - name: Setup Playwright Browsers
        if: inputs.enable-playwright || inputs.enable-e2e
        uses: Florencea/vp-actions/actions/setup-playwright@v3.0.0

      - name: Execute Pre-test Hook
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Inner Loop Verification (Typecheck, Lint, Tailwind)
        run: vp run agent:verify:inner

      - name: Dead Code Check (Knip)
        run: vp run check:deadcode

      - name: Unit Tests
        run: vp run agent:test:unit

      - name: Build Production Targets
        run: ${{ inputs.build-command }}

      - name: Pack Unpacked Application
        if: inputs.enable-e2e
        run: vp run --no-cache app:pack
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Run E2E Smoke Test
        if: inputs.enable-e2e
        run: xvfb-run --auto-servernum vp run agent:test:e2e

      - name: Package on Linux
        if: inputs.enable-package
        run: vp run --no-cache app:linux
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Generate Gatekeeper Step Summary
        if: always()
        run: |
          {
            echo "### Gatekeeper Summary (Linux)"
            echo "- **Node.js**: $(node -v)"
            echo "- **Vite+**: $(vp --version 2>&1 | head -n 1)"
            echo "- **Runner OS**: ${{ runner.os }} (${{ runner.arch }})"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gatekeeper-failure-artifacts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            out/
            test-results/
            playwright-report/
            *.log

  platform-package:
    name: Platform Package (${{ matrix.os }})
    needs: [gatekeeper]
    if: inputs.enable-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Vite+ Environment
        uses: Florencea/vp-actions/actions/setup-vp-env@v3.0.0
        with:
          checkout: "false"

      - name: Setup Playwright Browsers
        if: inputs.enable-playwright
        uses: Florencea/vp-actions/actions/setup-playwright@v3.0.0

      - name: Execute Pre-test Hook
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Unit Tests
        run: vp run agent:test:unit

      - name: Build Production Targets
        run: ${{ inputs.build-command }}

      - name: Package on macOS
        if: runner.os == 'macOS'
        run: vp run --no-cache app:mac
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Package on Windows
        if: runner.os == 'Windows'
        run: vp run --no-cache app:win
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Generate Platform Package Step Summary
        if: always()
        run: |
          {
            echo "### Platform Package Summary (${{ matrix.os }})"
            echo "- **Node.js**: $(node -v)"
            echo "- **Runner OS**: ${{ runner.os }} (${{ runner.arch }})"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: platform-package-failure-artifacts-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            out/
            test-results/
            playwright-report/
            *.log
