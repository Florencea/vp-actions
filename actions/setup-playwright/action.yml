name: Setup Playwright Browsers
description: Restores cached Playwright browser binaries, installs missing binaries, and configures Linux system dependencies.

inputs:
  browser:
    description: Playwright browser to install (e.g. chromium)
    required: false
    default: chromium
  install-deps:
    description: Whether to install Linux system dependencies
    required: false
    default: "true"
  setup-command:
    description: Command used to install browser binaries
    required: false
    default: vp run test:setup

runs:
  using: composite
  steps:
    - name: Set Playwright Browser Path
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/.cache/ms-playwright" >> "$GITHUB_ENV"

    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(vp exec playwright --version 2>/dev/null | awk '{print $2}' | tr -d '\r' || echo 'latest')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright Browsers
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ${{ github.workspace }}/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-playwright-

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: ${{ inputs.setup-command }}

    - name: Configure Linux APT resilience
      if: runner.os == 'Linux' && inputs.install-deps == 'true'
      shell: bash
      run: |
        sudo python3 -c '
        import glob, pathlib
        patterns = ["/etc/apt/sources.list", "/etc/apt/sources.list.d/*.sources", "/etc/apt/sources.list.d/*.list"]
        for pattern in patterns:
            for path_str in glob.glob(pattern):
                p = pathlib.Path(path_str)
                if p.is_file():
                    try:
                        text = p.read_text(encoding="utf-8", errors="ignore")
                        if "azure.archive.ubuntu.com" in text:
                            p.write_text(text.replace("azure.archive.ubuntu.com", "archive.ubuntu.com"), encoding="utf-8")
                    except Exception:
                        pass
        ' || true
        sudo mkdir -p /etc/apt/apt.conf.d
        echo 'Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-playwright-retries >/dev/null || true
        echo 'nameserver 8.8.8.8
        nameserver 1.1.1.1' | sudo tee -a /etc/resolv.conf >/dev/null || true

    - name: Install Playwright system dependencies on Linux
      if: runner.os == 'Linux' && inputs.install-deps == 'true'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          echo "Attempt $attempt: installing Playwright system dependencies for ${{ inputs.browser }}..."
          if vp exec playwright install-deps ${{ inputs.browser }}; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Attempt $attempt failed. Waiting 5s before retry..." >&2
            sleep 5
          fi
        done
        echo "Failed to install Playwright dependencies after 3 attempts." >&2
        exit 1
