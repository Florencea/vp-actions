name: Setup Playwright Browsers
description: Installs Playwright Chromium and Linux system dependencies.

runs:
  using: composite
  steps:
    - name: Install Playwright Chromium (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: vp exec playwright install --with-deps chromium

    - name: Install Playwright Chromium
      if: runner.os != 'Linux'
      shell: bash
      run: vp exec playwright install chromium
