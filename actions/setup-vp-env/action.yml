name: Setup Vite+ Environment
description: Sets up Node.js with Vite+, installs dependencies, and manages the Vite Task Cache.

inputs:
  checkout:
    description: Whether to check out the repository
    required: false
    default: "true"
  node-version-file:
    description: Path to file containing Node.js version or package.json
    required: false
    default: package.json
  install-command:
    description: Command used to install dependencies
    required: false
    default: vp install

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: inputs.checkout == 'true'
      uses: actions/checkout@v7

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: true

    - name: Install dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Cache Vite Task Cache
      uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: ${{ runner.os }}-${{ runner.arch }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
          ${{ runner.os }}-${{ runner.arch }}-vite-task-cache-
